{% extends "base.html" %}
{% block title %}Editar Agendamento{% endblock %}

{% block content %}

<div class="container py-5" style="max-width:700px;">

    <h1 class="titulo text-center mb-4">
        Editar Agendamento
    </h1>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Serviço
            </label>

            <select
                name="servico_id"
                class="form-select"
                required>

                {% for servico in servicos %}

                <option
                    value="{{ servico.id }}"
                    {% if servico.id == agendamento.servico_id %}selected{% endif %}>

                    {{ servico.nome }}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Data
            </label>

            <input
                type="date"
                name="data"
                class="form-control"
                value="{{ agendamento.data.strftime('%Y-%m-%d') }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Hora
            </label>

            <input
                type="time"
                name="hora"
                class="form-control"
                value="{{ agendamento.hora.strftime('%H:%M') }}"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Observações
            </label>

            <textarea
                name="observacoes"
                class="form-control"
                rows="3">{{ agendamento.observacoes or "" }}</textarea>

        </div>

        <div class="d-flex flex-column flex-sm-row gap-2">

            <button
                type="submit"
                class="btn btn-warning flex-fill">

                Salvar Alterações

            </button>

            <a
                href="{{ url_for('meus_agendamentos') }}"
                class="btn btn-danger flex-fill">

                Cancelar

            </a>

        </div>

    </form>

</div>

{% endblock %}
